name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.15.7). Defaults to package.json version if empty."
        required: false
        type: string
      force_rebuild:
        description: "Rebuild and overwrite assets even if the release already has binaries"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if release assets already exist
        id: check_existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_REBUILD" != "true" ] && gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -q '^Craft-Agents-arm64\.dmg$'; then
            echo "Release $TAG already contains Craft-Agents-arm64.dmg — skipping CI rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.check_existing.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        if: steps.check_existing.outputs.skip != 'true'
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import code signing certificate (optional)
        if: steps.check_existing.outputs.skip != 'true'
        id: codesign
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No CSC_LINK secret configured — building with ad-hoc signature."
            exit 0
          fi
          CERT_TMP="$(mktemp -d)"
          echo "$CSC_LINK" | base64 --decode > "$CERT_TMP/cert.p12"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          KEYCHAIN_PATH="$RUNNER_TEMP/craft-codesign.keychain-db"
          PASS_FILE="$RUNNER_TEMP/craft-codesign.pass"
          printf "%s" "$KEYCHAIN_PASS" > "$PASS_FILE"
          chmod 600 "$PASS_FILE"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_TMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -p codesigning "$KEYCHAIN_PATH"
          rm -rf "$CERT_TMP"

          echo "CRAFT_CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CRAFT_CODESIGN_PASS_FILE=$PASS_FILE" >> "$GITHUB_ENV"

      - name: Build macOS arm64 DMG & ZIP
        if: steps.check_existing.outputs.skip != 'true'
        run: |
          bun run scripts/build.ts --platform=darwin --arch=arm64
          ls -lh apps/electron/release/

      - name: Publish GitHub Release
        if: steps.check_existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_existing.outputs.tag }}
        run: |
          VER="${TAG#v}"
          NOTES_FILE="apps/electron/resources/release-notes/${VER}.md"

          ARTIFACTS=(
            apps/electron/release/Craft-Agents-arm64.dmg
            apps/electron/release/Craft-Agents-arm64.zip
            apps/electron/release/latest-mac.yml
          )
          for bm in apps/electron/release/*.blockmap; do
            [ -f "$bm" ] && ARTIFACTS+=("$bm")
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading/updating assets..."
            gh release upload "$TAG" "${ARTIFACTS[@]}" --clobber
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" "${ARTIFACTS[@]}" --title "Craft Agents ${TAG}" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" "${ARTIFACTS[@]}" --title "Craft Agents ${TAG}" --generate-notes
            fi
          fi
